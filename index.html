    <script>
      // aplica o modo antes da primeira pintura, para não piscar (padrão: claro, como o fluxograma)
      try {
        var p = new URLSearchParams(location.search).get("modo");
        var t = p === "claro" || p === "escuro" ? p : localStorage.getItem("compendio:modo");
        document.documentElement.dataset.modo = t === "escuro" ? "escuro" : "claro";
      } catch (e) { document.documentElement.dataset.modo = "claro"; }
